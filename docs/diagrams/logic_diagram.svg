<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background and UI styles -->
    <style>
      .bg { fill: #0d1117; }
      .text-title { font-size: 28px; font-weight: bold; fill: #e5e7eb; letter-spacing: 2px; font-family: sans-serif; }
      .text-subtitle { font-size: 16px; fill: #9ca3af; font-family: sans-serif; }
      .box-b1 { fill: rgba(59, 130, 246, 0.05); stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .box-b2 { fill: rgba(239, 68, 68, 0.05); stroke: #ef4444; stroke-width: 2; rx: 12; }
      .box-b3 { fill: rgba(16, 185, 129, 0.05); stroke: #10b981; stroke-width: 2; rx: 12; }
      .box-title-b1 { fill: #60a5fa; font-size: 18px; font-weight: bold; font-family: sans-serif; }
      .box-title-b2 { fill: #f87171; font-size: 18px; font-weight: bold; font-family: sans-serif; }
      .box-title-b3 { fill: #34d399; font-size: 18px; font-weight: bold; font-family: sans-serif; }
      .lt { font-size: 14px; fill: #d1d5db; text-anchor: middle; font-weight: bold; font-family: sans-serif; }
      
      .link-mpls { stroke: #eab308; stroke-width: 2; opacity: 0.7; }
      .link { stroke: #6b7280; stroke-width: 2; opacity: 0.8; }
      
      .layer-txt { font-size: 12px; font-weight: bold; fill: rgba(255,255,255,0.4); text-anchor: start; letter-spacing: 1px; font-family: sans-serif; }
      .layer-line { stroke: rgba(255,255,255,0.1); stroke-width: 1; stroke-dasharray: 5 3; }
    </style>
    
    <!-- Icons Templates -->
    <g id="pe-router">
      <circle cx="0" cy="0" r="22" fill="#6d28d9" stroke="#a78bfa" stroke-width="2"/>
      <text x="0" y="4" fill="white" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">PE</text>
    </g>
    <g id="p-router">
      <circle cx="0" cy="0" r="22" fill="#b45309" stroke="#fde68a" stroke-width="2"/>
      <text x="0" y="4" fill="white" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">P</text>
    </g>
    <g id="ce-router">
      <circle cx="0" cy="0" r="22" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
      <text x="0" y="4" fill="white" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CE</text>
    </g>
    <g id="sw-blue">
      <rect x="-24" y="-14" width="48" height="28" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="4" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">SW</text>
    </g>
    <g id="sw-red">
      <rect x="-24" y="-14" width="48" height="28" rx="4" fill="#991b1b" stroke="#f87171" stroke-width="2"/>
      <text x="0" y="4" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">SW</text>
    </g>
    <g id="sw-green">
      <rect x="-24" y="-14" width="48" height="28" rx="4" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="0" y="4" fill="white" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">SW</text>
    </g>
    <g id="pc">
      <rect x="-18" y="-12" width="36" height="22" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <rect x="-8" y="10" width="16" height="4" fill="#94a3b8" />
    </g>
    <g id="server">
      <rect x="-15" y="-18" width="30" height="36" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <line x1="-8" y1="-10" x2="8" y2="-10" stroke="#38bdf8" stroke-width="2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <line x1="-8" y1="10" x2="8" y2="10" stroke="#38bdf8" stroke-width="2"/>
    </g>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="750" y="40" class="text-title" text-anchor="middle">SƠ ĐỒ LOGIC - METRO ETHERNET MPLS</text>
  <text x="750" y="70" class="text-subtitle" text-anchor="middle">Mô phỏng mạng 3 chi nhánh kết nối qua ISP Backbone</text>

  <!-- LINES layer (drawn before nodes so they appear behind) -->
  <g id="links">
    <!-- MPLS Links -->
    <line x1="250" y1="230" x2="650" y2="140" class="link-mpls" />
    <line x1="250" y1="230" x2="650" y2="220" class="link-mpls" />
    <line x1="1250" y1="230" x2="850" y2="140" class="link-mpls" />
    <line x1="1250" y1="230" x2="850" y2="220" class="link-mpls" />
    <line x1="750" y1="300" x2="650" y2="220" class="link-mpls" />
    <line x1="750" y1="300" x2="850" y2="220" class="link-mpls" />
    
    <line x1="650" y1="140" x2="850" y2="140" class="link-mpls" />
    <line x1="650" y1="220" x2="850" y2="220" class="link-mpls" />
    <line x1="650" y1="140" x2="650" y2="220" class="link-mpls" />
    <line x1="850" y1="140" x2="850" y2="220" class="link-mpls" />
    <line x1="650" y1="140" x2="850" y2="220" class="link-mpls" />
    <line x1="650" y1="220" x2="850" y2="140" class="link-mpls" />

    <!-- PE to CE Links -->
    <line x1="250" y1="230" x2="250" y2="440" class="link" stroke-dasharray="8 4" />
    <line x1="750" y1="300" x2="750" y2="440" class="link" stroke-dasharray="8 4" />
    <line x1="1250" y1="230" x2="1250" y2="440" class="link" stroke-dasharray="8 4" />

    <!-- Branch 1 Links -->
    <line x1="250" y1="440" x2="160" y2="550" class="link" />
    <line x1="250" y1="440" x2="340" y2="550" class="link" />
    <line x1="160" y1="550" x2="120" y2="680" class="link" />
    <line x1="160" y1="550" x2="200" y2="680" class="link" />
    <line x1="340" y1="550" x2="300" y2="680" class="link" />
    <line x1="340" y1="550" x2="380" y2="680" class="link" />

    <!-- Branch 2 Links -->
    <line x1="750" y1="440" x2="650" y2="520" class="link" />
    <line x1="750" y1="440" x2="850" y2="520" class="link" />
    <line x1="650" y1="520" x2="620" y2="650" class="link" />
    <line x1="650" y1="520" x2="880" y2="650" class="link" />
    <line x1="850" y1="520" x2="620" y2="650" class="link" />
    <line x1="850" y1="520" x2="880" y2="650" class="link" />
    <line x1="620" y1="650" x2="540" y2="780" class="link" />
    <line x1="620" y1="650" x2="750" y2="780" class="link" />
    <line x1="620" y1="650" x2="960" y2="780" class="link" />
    <line x1="880" y1="650" x2="540" y2="780" class="link" />
    <line x1="880" y1="650" x2="750" y2="780" class="link" />
    <line x1="880" y1="650" x2="960" y2="780" class="link" />
    
    <!-- Branch 2 Access to PCs -->
    <line x1="540" y1="780" x2="500" y2="900" class="link" />
    <line x1="540" y1="780" x2="580" y2="900" class="link" />
    <line x1="750" y1="780" x2="710" y2="900" class="link" />
    <line x1="750" y1="780" x2="790" y2="900" class="link" />
    <line x1="960" y1="780" x2="920" y2="900" class="link" />
    <line x1="960" y1="780" x2="1000" y2="900" class="link" />

    <!-- Branch 3 Links -->
    <line x1="1250" y1="440" x2="1185" y2="550" class="link" />
    <line x1="1250" y1="440" x2="1315" y2="550" class="link" />
    
    <line x1="1185" y1="550" x2="1140" y2="700" class="link" />
    <line x1="1185" y1="550" x2="1250" y2="700" class="link" />
    <line x1="1185" y1="550" x2="1360" y2="700" class="link" />
    
    <line x1="1315" y1="550" x2="1140" y2="700" class="link" />
    <line x1="1315" y1="550" x2="1250" y2="700" class="link" />
    <line x1="1315" y1="550" x2="1360" y2="700" class="link" />

    <!-- Branch 3 Leaf to Servers -->
    <line x1="1140" y1="700" x2="1105" y2="830" class="link" />
    <line x1="1140" y1="700" x2="1175" y2="830" class="link" />
    
    <line x1="1250" y1="700" x2="1215" y2="830" class="link" />
    <line x1="1250" y1="700" x2="1285" y2="830" class="link" />
    
    <line x1="1360" y1="700" x2="1325" y2="830" class="link" />
    <line x1="1360" y1="700" x2="1395" y2="830" class="link" />
  </g>

  <!-- MPLS CLOUD AREA -->
  <ellipse cx="750" cy="200" rx="600" ry="120" fill="rgba(234, 179, 8, 0.05)" stroke="#eab308" stroke-width="2" stroke-dasharray="12 6" />
  <text x="750" y="110" fill="#fde047" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">☁ VÙNG MPLS</text>

  <!-- BOXES FOR BRANCHES -->
  <rect x="70" y="380" width="360" height="580" class="box-b1" />
  <rect x="450" y="380" width="580" height="580" class="box-b2" />
  <rect x="1050" y="380" width="370" height="580" class="box-b3" />

  <text x="250" y="415" class="box-title-b1" text-anchor="middle">CHI NHÁNH 1 (MẠNG PHẲNG)</text>
  <text x="740" y="415" class="box-title-b2" text-anchor="middle">CHI NHÁNH 2 (MẠNG 3 LỚP)</text>
  <text x="1235" y="415" class="box-title-b3" text-anchor="middle">CHI NHÁNH 3 (MẠNG 2 LỚP)</text>

  <!-- LAYER INDICATORS (Branch 2 & 3) -->
  <line x1="470" y1="580" x2="1010" y2="580" class="layer-line"/>
  <text x="480" y="573" class="layer-txt">LỚP CORE</text>
  
  <line x1="470" y1="710" x2="1010" y2="710" class="layer-line"/>
  <text x="480" y="703" class="layer-txt">LỚP DISTRIBUTION</text>
  
  <text x="480" y="830" class="layer-txt">LỚP ACCESS</text>

  <line x1="1070" y1="620" x2="1400" y2="620" class="layer-line"/>
  <text x="1080" y="613" class="layer-txt">SPINE LAYER</text>
  
  <text x="1080" y="760" class="layer-txt">LEAF LAYER</text>

  <!-- NODES FOREGROUND -->
  <!-- MPLS Core Nodes -->
  <use href="#pe-router" x="250" y="230" /> <text x="250" y="270" class="lt">PE1</text>
  <use href="#pe-router" x="750" y="300" /> <text x="750" y="340" class="lt">PE2</text>
  <use href="#pe-router" x="1250" y="230" /> <text x="1250" y="270" class="lt">PE3</text>
  
  <use href="#p-router" x="650" y="140" /> <text x="650" y="180" class="lt">P1</text>
  <use href="#p-router" x="850" y="140" /> <text x="850" y="180" class="lt">P2</text>
  <use href="#p-router" x="650" y="220" /> <text x="650" y="260" class="lt">P3</text>
  <use href="#p-router" x="850" y="220" /> <text x="850" y="260" class="lt">P4</text>

  <!-- Branch 1 (Flat) Nodes -->
  <use href="#ce-router" x="250" y="440" /> <text x="250" y="480" class="lt">CE1</text>
  <use href="#sw-blue" x="160" y="550" /> <text x="160" y="580" class="lt">sw1</text>
  <use href="#sw-blue" x="340" y="550" /> <text x="340" y="580" class="lt">sw2</text>
  <use href="#pc" x="120" y="680" /> <text x="120" y="715" class="lt">host1</text>
  <use href="#pc" x="200" y="680" /> <text x="200" y="715" class="lt">host2</text>
  <use href="#pc" x="300" y="680" /> <text x="300" y="715" class="lt">host3</text>
  <use href="#pc" x="380" y="680" /> <text x="380" y="715" class="lt">host4</text>

  <!-- Branch 2 (3-Tier) Nodes -->
  <use href="#ce-router" x="750" y="440" /> <text x="750" y="480" class="lt">CE2</text>
  <use href="#sw-red" x="650" y="520" /> <text x="650" y="550" class="lt">sw_core1</text>
  <use href="#sw-red" x="850" y="520" /> <text x="850" y="550" class="lt">sw_core2</text>
  <use href="#sw-red" x="620" y="650" /> <text x="620" y="680" class="lt">sw_dist1</text>
  <use href="#sw-red" x="880" y="650" /> <text x="880" y="680" class="lt">sw_dist2</text>
  <use href="#sw-blue" x="540" y="780" /> <text x="540" y="810" class="lt">sw_acc1</text>
  <use href="#sw-blue" x="750" y="780" /> <text x="750" y="810" class="lt">sw_acc2</text>
  <use href="#sw-blue" x="960" y="780" /> <text x="960" y="810" class="lt">sw_acc3</text>
  
  <use href="#pc" x="500" y="900" /> <text x="500" y="930" class="lt">admin1</text>
  <use href="#pc" x="580" y="900" /> <text x="580" y="930" class="lt">admin2</text>
  <use href="#pc" x="710" y="900" /> <text x="710" y="930" class="lt">lab1</text>
  <use href="#pc" x="790" y="900" /> <text x="790" y="930" class="lt">lab2</text>
  <use href="#pc" x="920" y="900" /> <text x="920" y="930" class="lt">guest1</text>
  <use href="#pc" x="1000" y="900" /> <text x="1000" y="930" class="lt">guest2</text>

  <!-- Branch 3 (Leaf-Spine) Nodes -->
  <use href="#ce-router" x="1250" y="440" /> <text x="1250" y="480" class="lt">CE3</text>
  <use href="#sw-green" x="1185" y="550" /> <text x="1185" y="580" class="lt">spine1</text>
  <use href="#sw-green" x="1315" y="550" /> <text x="1315" y="580" class="lt">spine2</text>
  <use href="#sw-blue" x="1140" y="700" /> <text x="1140" y="730" class="lt">leaf1</text>
  <use href="#sw-blue" x="1250" y="700" /> <text x="1250" y="730" class="lt">leaf2</text>
  <use href="#sw-blue" x="1360" y="700" /> <text x="1360" y="730" class="lt">leaf3</text>
  
  <use href="#server" x="1105" y="830" /> <text x="1105" y="865" class="lt">web1</text>
  <use href="#server" x="1175" y="830" /> <text x="1175" y="865" class="lt">web2</text>
  <use href="#server" x="1215" y="830" /> <text x="1215" y="865" class="lt">dns1</text>
  <use href="#server" x="1285" y="830" /> <text x="1285" y="865" class="lt">dns2</text>
  <use href="#server" x="1325" y="830" /> <text x="1325" y="865" class="lt">db1</text>
  <use href="#server" x="1395" y="830" /> <text x="1395" y="865" class="lt">db2</text>
</svg>
